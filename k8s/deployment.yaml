apiVersion: apps/v1
kind: Deployment

metadata:
  name: tnttfc

spec:
  replicas: 2

  selector:
    matchLabels:
      app: tnttfc

  template:
    metadata:
      labels:
        app: tnttfc

    spec:
      containers:
      - name: tnttfc

        image: 306616136668.dkr.ecr.ap-south-1.amazonaws.com/tnttfc:v1

        imagePullPolicy: Always

        ports:
        - containerPort: 8000
